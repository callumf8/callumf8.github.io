description: Postdoc | IAS | Astrophysical Fluid Dynamics

#baseurl: /gradfolio #name of GitHub repository
url: "" #custom url to be used instead of GitHub repository
email: #

# Pagination
paginate: 4
permalink: /blog/:year/:title/
paginate_path: /blog/page:num/

# Social media links in footer
linkedin: "https://www.linkedin.com/in/callum-fairbairn/"
